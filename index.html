<!DOCTYPE html>

<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FamilyBudget - Gestione Spese Familiare</title>

    

    <!-- Google Fonts & FontAwesome -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {

            --primary: #3b82f6;

            --primary-hover: #2563eb;

            --bg-color: #f8fafc;

            --card-bg: #ffffff;

            --text-main: #1e293b;

            --text-muted: #64748b;

            --border-color: #e2e8f0;

            --success: #10b981;

            --danger: #ef4444;

            --radius: 12px;

            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);

        }

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: 'Inter', sans-serif;

        }

        body {

            background-color: var(--bg-color);

            color: var(--text-main);

            padding: 20px;

            max-width: 1200px;

            margin: 0 auto;

        }

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 24px;

            padding-bottom: 16px;

            border-bottom: 1px solid var(--border-color);

        }

        header h1 {

            font-size: 1.5rem;

            color: var(--text-main);

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .dashboard-grid {

            display: grid;

            grid-template-columns: 1fr;

            gap: 20px;

        }

        @media (min-width: 768px) {

            .dashboard-grid {

                grid-template-columns: 1fr 2fr;

            }

        }

        .card {

            background: var(--card-bg);

            border-radius: var(--radius);

            padding: 20px;

            box-shadow: var(--shadow);

            border: 1px solid var(--border-color);

            margin-bottom: 20px;

        }

        .card h2 {

            font-size: 1.1rem;

            margin-bottom: 16px;

            color: var(--text-main);

            display: flex;

            align-items: center;

            gap: 8px;

        }

        .form-group {

            margin-bottom: 14px;

        }

        .form-group label {

            display: block;

            font-size: 0.85rem;

            font-weight: 500;

            margin-bottom: 6px;

            color: var(--text-muted);

        }

        .form-control {

            width: 100%;

            padding: 10px 12px;

            border: 1px solid var(--border-color);

            border-radius: 8px;

            font-size: 0.95rem;

            outline: none;

            transition: border-color 0.2s;

        }

        .form-control:focus {

            border-color: var(--primary);

        }

        .btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            width: 100%;

            padding: 10px 16px;

            border: none;

            border-radius: 8px;

            background-color: var(--primary);

            color: white;

            font-size: 0.95rem;

            font-weight: 600;

            cursor: pointer;

            transition: background-color 0.2s;

        }

        .btn:hover {

            background-color: var(--primary-hover);

        }

        .btn-secondary {

            background-color: #64748b;

        }

        .btn-secondary:hover {

            background-color: #475569;

        }

        .scanner-box {

            border: 2px dashed var(--border-color);

            padding: 20px;

            text-align: center;

            border-radius: var(--radius);

            margin-bottom: 16px;

            background-color: #fafafa;

            cursor: pointer;

            transition: border-color 0.2s;

        }

        .scanner-box:hover {

            border-color: var(--primary);

        }

        .scanner-box i {

            font-size: 2rem;

            color: var(--text-muted);

            margin-bottom: 8px;

        }

        #preview-img {

            max-width: 100%;

            max-height: 200px;

            border-radius: 8px;

            margin-top: 10px;

            display: none;

        }

        .loader {

            display: none;

            border: 3px solid #f3f3f3;

            border-top: 3px solid var(--primary);

            border-radius: 50%;

            width: 24px;

            height: 24px;

            animation: spin 1s linear infinite;

            margin: 10px auto;

        }

        @keyframes spin {

            0% { transform: rotate(0deg); }

            100% { transform: rotate(360deg); }

        }

        table {

            width: 100%;

            border-collapse: collapse;

            text-align: left;

            font-size: 0.9rem;

        }

        th, td {

            padding: 12px;

            border-bottom: 1px solid var(--border-color);

        }

        th {

            background-color: #f1f5f9;

            color: var(--text-muted);

            font-weight: 600;

        }

        .badge {

            padding: 4px 8px;

            border-radius: 6px;

            font-size: 0.75rem;

            font-weight: 600;

        }

        .badge-spesa { background: #fee2e2; color: #991b1b; }

        .badge-entrata { background: #d1fae5; color: #065f46; }

        .summary-cards {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

            gap: 12px;

            margin-bottom: 20px;

        }

        .summary-card {

            background: white;

            padding: 16px;

            border-radius: var(--radius);

            border: 1px solid var(--border-color);

            box-shadow: var(--shadow);

        }

        .summary-card span {

            font-size: 0.8rem;

            color: var(--text-muted);

        }

        .summary-card h3 {

            font-size: 1.4rem;

            margin-top: 4px;

        }

        .delete-btn {

            color: var(--danger);

            cursor: pointer;

            border: none;

            background: none;

        }

    </style>

</head>

<body>

    <header>

        <h1><i class="fa-solid fa-wallet"></i> FamilyBudget</h1>

        <div id="user-info" style="font-size: 0.9rem; color: var(--text-muted);">

            Gestione Finanziaria Familiare

        </div>

    </header>

    <div class="summary-cards">

        <div class="summary-card">

            <span>Totale Entrate</span>

            <h3 id="total-incomes" style="color: var(--success);">€ 0,00</h3>

        </div>

        <div class="summary-card">

            <span>Totale Uscite</span>

            <h3 id="total-expenses" style="color: var(--danger);">€ 0,00</h3>

        </div>

        <div class="summary-card">

            <span>Saldo Attuale</span>

            <h3 id="total-balance">€ 0,00</h3>

        </div>

    </div>

    <div class="dashboard-grid">

        <!-- Colonna Sinistra: Input e Scanner -->

        <div class="left-column">

            <!-- Card Scanner AI -->

            <div class="card">

                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Scan Scontrino AI</h2>

                <div class="scanner-box" onclick="document.getElementById('receipt-input').click()">

                    <i class="fa-solid fa-camera"></i>

                    <p style="font-size: 0.85rem; color: var(--text-muted);">Carica o scatta una foto allo scontrino</p>

                    <input type="file" id="receipt-input" accept="image/*" style="display: none" onchange="previewAndAnalyze(event)">

                    <img id="preview-img" alt="Anteprima scontrino">

                </div>

                <div class="loader" id="ai-loader"></div>

                <p id="ai-status" style="font-size: 0.8rem; text-align: center; color: var(--text-muted);"></p>

            </div>

            <!-- Card Form Manuale -->

            <div class="card">

                <h2><i class="fa-solid fa-plus-circle"></i> Aggiungi Transazione</h2>

                <form id="transaction-form">

                    <div class="form-group">

                        <label for="desc">Descrizione</label>

                        <input type="text" id="desc" class="form-control" placeholder="Es. Spesa Conad" required>

                    </div>

                    <div class="form-group">

                        <label for="amount">Importo (€)</label>

                        <input type="number" step="0.01" id="amount" class="form-control" placeholder="0.00" required>

                    </div>

                    <div class="form-group">

                        <label for="type">Tipo</label>

                        <select id="type" class="form-control">

                            <option value="uscita">Uscita</option>

                            <option value="entrata">Entrata</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="category">Categoria</label>

                        <select id="category" class="form-control">

                            <option value="Alimentari">Alimentari</option>

                            <option value="Casa">Casa</option>

                            <option value="Trasporti">Trasporti</option>

                            <option value="Svago">Svago</option>

                            <option value="Salute">Salute</option>

                            <option value="Stipendio">Stipendio</option>

                            <option value="Altro">Altro</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="date">Data</label>

                        <input type="date" id="date" class="form-control" required>

                    </div>

                    <button type="submit" class="btn"><i class="fa-solid fa-save"></i> Salva Transazione</button>

                </form>

            </div>

        </div>

        <!-- Colonna Destra: Lista Transazioni -->

        <div class="right-column">

            <div class="card">

                <h2><i class="fa-solid fa-list"></i> Storico Transazioni</h2>

                <div style="overflow-x: auto;">

                    <table>

                        <thead>

                            <tr>

                                <th>Data</th>

                                <th>Descrizione</th>

                                <th>Categoria</th>

                                <th>Importo</th>

                                <th>Azioni</th>

                            </tr>

                        </thead>

                        <tbody id="transaction-list">

                            <!-- Le righe verranno inserite dinamicamente via JS -->

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- Firebase SDK Modular -->

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURAZIONE FIREBASE (Sostituire con i propri dati)

        const firebaseConfig = {

            apiKey: "YOUR_FIREBASE_API_KEY",

            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",

            projectId: "YOUR_PROJECT_ID",

            storageBucket: "YOUR_PROJECT_ID.appspot.com",

            messagingSenderId: "YOUR_SENDER_ID",

            appId: "YOUR_APP_ID"

        };

        // Inizializzazione Firebase

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const transactionsRef = collection(db, "transactions");

        // CONFIGURAZIONE GEMINI API KEY

        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

        // Imposta data odierna nel form

        document.getElementById('date').valueAsDate = new Date();

        // Salva Transazione nel DB

        document.getElementById('transaction-form').addEventListener('submit', async (e) => {

            e.preventDefault();

            

            const desc = document.getElementById('desc').value;

            const amount = parseFloat(document.getElementById('amount').value);

            const type = document.getElementById('type').value;

            const category = document.getElementById('category').value;

            const date = document.getElementById('date').value;

            try {

                await addDoc(transactionsRef, {

                    description: desc,

                    amount: amount,

                    type: type,

                    category: category,

                    date: date,

                    createdAt: new Date()

                });

                document.getElementById('transaction-form').reset();

                document.getElementById('date').valueAsDate = new Date();

            } catch (error) {

                console.error("Errore durante il salvataggio: ", error);

                alert("Errore nel salvataggio della transazione.");

            }

        });

        // Ascolto Cambiamenti Firestore in Tempo Reale

        const q = query(transactionsRef, orderBy("date", "desc"));

        onSnapshot(q, (snapshot) => {

            const listEl = document.getElementById('transaction-list');

            listEl.innerHTML = '';

            let totalIncomes = 0;

            let totalExpenses = 0;

            snapshot.forEach((docSnap) => {

                const item = docSnap.data();

                const id = docSnap.id;

                if (item.type === 'entrata') {

                    totalIncomes += item.amount;

                } else {

                    totalExpenses += item.amount;

                }

                const tr = document.createElement('tr');

                tr.innerHTML = `

                    <td>${item.date}</td>

                    <td><strong>${item.description}</strong></td>

                    <td><span class="badge ${item.type === 'entrata' ? 'badge-entrata' : 'badge-spesa'}">${item.category}</span></td>

                    <td style="color: ${item.type === 'entrata' ? 'var(--success)' : 'var(--danger)'}; font-weight: 600;">

                        ${item.type === 'entrata' ? '+' : '-'} € ${item.amount.toFixed(2)}

                    </td>

                    <td>

                        <button class="delete-btn" onclick="deleteTransaction('${id}')"><i class="fa-solid fa-trash"></i></button>

                    </td>

                `;

                listEl.appendChild(tr);

            });

            // Aggiorna KPI

            document.getElementById('total-incomes').innerText = `€ ${totalIncomes.toFixed(2)}`;

            document.getElementById('total-expenses').innerText = `€ ${totalExpenses.toFixed(2)}`;

            const balance = totalIncomes - totalExpenses;

            const balanceEl = document.getElementById('total-balance');

            balanceEl.innerText = `€ ${balance.toFixed(2)}`;

            balanceEl.style.color = balance >= 0 ? 'var(--success)' : 'var(--danger)';

        });

        // Cancella Transazione

        window.deleteTransaction = async (id) => {

            if (confirm("Sei sicuro di voler eliminare questa transazione?")) {

                await deleteDoc(doc(db, "transactions", id));

            }

        };

        // Gestione Anteprima e Avvio Analisi AI

        window.previewAndAnalyze = function (event) {

            const file = event.target.files[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (e) {

                const imgEl = document.getElementById('preview-img');

                imgEl.src = e.target.result;

                imgEl.style.display = 'block';

                const base64Data = e.target.result.split(',')[1];

                analizzaConGeminiVision(base64Data, file.type);

            };

            reader.readAsDataURL(file);

        };

        // FUNZIONE GEMINI VISION API INTEGRATA

        async function analizzaConGeminiVision(base64Image, mimeType) {

            const loader = document.getElementById('ai-loader');

            const status = document.getElementById('ai-status');

            loader.style.display = 'block';

            status.innerText = "Analisi dello scontrino con AI in corso...";

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

            const prompt = `Analizza questa immagine di uno scontrino fiscale ed estrai le seguenti informazioni sotto forma di JSON valido:

            {

                "merchant": "Nome dell'esercente o negozio",

                "amount": importo totale come numero decimale (es. 12.50),

                "date": "Data dello scontrino nel formato YYYY-MM-DD",

                "category": "Una tra queste categorie: Alimentari, Casa, Trasporti, Svago, Salute, Altro"

            }

            Rispondi ESCLUSIVAMENTE con il blocco JSON senza alcun testo introduttivo o formattazione markdown aggiuntiva.`;

            const payload = {

                contents: [{

                    parts: [

                        { text: prompt },

                        {

                            inline_data: {

                                mime_type: mimeType,

                                data: base64Image

                            }

                        }

                    ]

                }]

            };

            try {

                const response = await fetch(endpoint, {

                    method: 'POST',

                    headers: { 'Content-Type': 'application/json' },

                    body: JSON.stringify(payload)

                });

                const data = await response.json();

                

                if (!response.ok) {

                    throw new Error(data.error?.message || "Errore nella chiamata API Gemini");

|---|

                const rawText = data.candidates[0].content.parts[0].text.trim();

                const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

                const parsedData = JSON.parse(cleanJson);

                // Auto-compilazione del modulo

                if (parsedData.merchant) document.getElementById('desc').value = parsedData.merchant;

                if (parsedData.amount) document.getElementById('amount').value = parsedData.amount;

                if (parsedData.date) document.getElementById('date').value = parsedData.date;

                if (parsedData.category) document.getElementById('category').value = parsedData.category;

                document.getElementById('type').value = 'uscita';

                status.innerText = "Scontrino analizzato con successo!";

                status.style.color = "var(--success)";

            } catch (err) {

                console.error("Errore analisi Gemini Vision:", err);

                status.innerText = "Impossibile analizzare lo scontrino. Compilazione manuale richiesta.";

                status.style.color = "var(--danger)";

            } finally {

                loader.style.display = 'none';

            }

        }

    </script>

</body>

</html>
